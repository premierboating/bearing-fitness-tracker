# Bearing: cloud builds. iOS goes to App Store Connect (TestFlight internal testing first); Android produces an APK to hand out directly.
# Needs: the "Bearing" App Store Connect integration under Teams > Integrations, and the bundle id below registered in the developer portal.
workflows:
  ios-app-store:
    name: Bearing iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Bearing
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bengruver.bearing
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install
        script: npm ci
      - name: Copy the web app into the iOS project
        script: npx cap sync ios
      - name: Build number from the Codemagic build counter
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 100))
      - name: Apply the signing profiles Codemagic fetched
        script: xcode-project use-profiles
      - name: Build the archive
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
  android-apk:
    name: Bearing Android
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      node: 20
      java: 17
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install
        script: npm ci
      - name: Copy the web app into the Android project
        script: npx cap sync android
      - name: Build a debug APK (installs directly, no store)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
